name: Deploy site to R2
# usmcmin.com is served from Cloudflare R2 (bucket: usmcmin-com-site) via the
# `usmcmin-com` Worker (zone routes). This action syncs the repo root -> R2 on
# every push to main, replacing the GitHub Pages build (kept only as fallback).
#
# NOTE: this is `rclone sync`, so anything in the bucket that is not in the repo
# gets DELETED. The Husband Course heavy media (~2 GB of audio, video, slide
# PDFs, and infographics) lives in R2 only — it is gitignored and uploaded
# out-of-band by tmc-husband/sync-media.sh. The excludes below are what keep a
# deploy from wiping it. If you add a new media directory, exclude it here too.
#
# The private steward pages (finance dashboards, Bow & Arrow ops pages, C5iSR
# dashboard, personal-outreach) are R2-only too since 2026-10-14: they are NOT in
# this public repo, the Worker edge-gates them by PIN, and the --exclude lines
# below keep a sync from deleting them. Working copy ~/usmcmin-com-private/,
# publish with ~/Scripts/usmcmin-com-private-publish.sh. DEPLOY-DOCTRINE.md rule 3b.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-r2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rclone
        run: |
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp
          sudo install -m 755 /tmp/rclone-*-linux-amd64/rclone /usr/local/bin/rclone
          rclone version
      - name: Sync site to R2 (delete guard)
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://a57e8cd919350d6bb9ced6f47ef627d3.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_MAX_DELETES: "50"
        run: |
          chmod +x bin/rclone-sync-guarded.sh bin/post-deploy-smoke.sh
          bin/rclone-sync-guarded.sh . r2:usmcmin-com-site -- 50 \
            --exclude '.git/**' --exclude '.github/**' \
            --exclude '.openclaw/**' --exclude '.clawhub/**' \
            --exclude 'workers/**' \
            --exclude 'assets/media/tmc-husband/*/audio/**' \
            --exclude 'assets/media/tmc-husband/*/video/**' \
            --exclude 'assets/media/tmc-husband/*/slides/**' \
            --exclude 'assets/media/tmc-husband/*/infographics/**' \
            --exclude 'assets/video/**.mp4' \
            --exclude 'assets/video/**.m4a' \
            --exclude 'finance/finance.html' \
            --exclude 'finance/financial-command.html' \
            --exclude 'finance/financial-onboarding.html' \
            --exclude 'finance/stewardship-dashboard.html' \
            --exclude 'finance/debt.html' \
            --exclude 'finance/forecast.html' \
            --exclude 'finance/review.html' \
            --exclude 'finance/finance-sw.js' \
            --exclude 'finance/finance.webmanifest' \
            --exclude 'bow-arrow/dashboard.html' \
            --exclude 'bow-arrow/financials.html' \
            --exclude 'bow-arrow/calendar.html' \
            --exclude 'bow-arrow/cleaning.html' \
            --exclude 'bow-arrow/comms.html' \
            --exclude 'bow-arrow/maintenance.html' \
            --exclude 'bow-arrow/assets/dashboard.js' \
            --exclude 'c5isr/dashboard.html' \
            --exclude 'c5isr/assets/dashboard.js' \
            --exclude 'personal-outreach.html' \
            --checksum --fast-list \
            --transfers 64 --checkers 64 \
            --s3-upload-cutoff 200M --s3-chunk-size 32M
      - name: Post-deploy smoke gate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "454000856"
        run: bin/post-deploy-smoke.sh com
