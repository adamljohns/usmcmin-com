<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Directory — Christ-Centered Commerce</title>
<meta http-equiv="refresh" content="0; url=index.html#directory-panel"/>
<link rel="canonical" href="https://usmcmin.com/fxbg/commerce/"/>
<style>:root{--bg:#0b1210;--bg-card:#14201c;--gold:#c9a84c;--gold-dim:rgba(201,168,76,.15);--text:#f2efe6;--gray:#9aa39a;--border:rgba(201,168,76,.22);--green:#2ecc71;--yellow:#f1c40f;--red:#e74c3c}
*{box-sizing:border-box}body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--bg);color:var(--text);line-height:1.55}
a{color:var(--gold)}.wrap{max-width:820px;margin:0 auto;padding:24px 18px 80px}
.module-tag{display:inline-block;background:var(--gold-dim);border:1px solid rgba(201,168,76,.35);color:var(--gold);font-family:Inter,system-ui,sans-serif;font-size:.72rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:4px 14px;border-radius:20px;margin-bottom:16px}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:400;margin:0 0 10px;line-height:1.15}h1 span{color:var(--gold)}
h2{color:var(--gold);font-weight:400;font-size:1.15rem;margin:0 0 10px}
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
.panel p,.panel li{color:#d7d2c6;font-size:.98rem}
.back{font-family:Inter,system-ui,sans-serif;font-size:.85rem}
.btn{font-family:Inter,system-ui,sans-serif;display:inline-block;text-decoration:none;font-weight:700;font-size:.88rem;padding:10px 16px;border-radius:8px;border:1px solid var(--gold);color:var(--gold);background:var(--gold-dim)}
.btn.solid{background:rgba(201,168,76,.28);color:var(--text)}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
table{width:100%;border-collapse:collapse;font-family:Inter,system-ui,sans-serif;font-size:.88rem}
td,th{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left;vertical-align:top}
th{color:var(--gold);font-weight:600}td:first-child{color:var(--gray)}
label{display:block;font-family:Inter,system-ui,sans-serif;font-size:.82rem;color:var(--gray);margin:12px 0 4px;letter-spacing:.3px}
input,select,textarea{width:100%;background:#0e1714;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font-family:Inter,system-ui,sans-serif;font-size:.95rem}
textarea{min-height:120px;resize:vertical}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0;overflow:hidden}
.note{font-family:Inter,system-ui,sans-serif;font-size:.8rem;color:var(--gray)}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--border);font-family:Inter,system-ui,sans-serif;font-size:.78rem;color:var(--gray);text-align:center}
.soft-banner{font-family:Inter,system-ui,sans-serif;font-size:.75rem;background:#1a2a22;color:#b8d4c4;padding:8px 12px;text-align:center;border-bottom:1px solid rgba(46,204,113,.25)}
.ok{color:var(--green)}.err{color:var(--red)}</style>
</head>
<body>
<div class="wrap">
  <p><a class="back" href="index.html">← Full hub + directory</a></p>
  <p class="note">Redirecting to hub directory…</p>
</div>
</body>
</html>
