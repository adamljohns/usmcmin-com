<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Directory — Christ-Centered Commerce</title>
  <meta name="description" content="317 Fredericksburg-area businesses — filter by category and overall band." />
  <link rel="stylesheet" href="assets/commerce.css" />
  <style>
    .filter-bar { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; align-items:center; }
    .filter-bar select, .filter-bar input {
      width:auto; min-width:140px; flex:1 1 140px;
    }
    .count-line { font-size:0.82rem; color:var(--gray); margin-bottom:12px; }
    #biz-grid { display:grid; gap:12px; }
    @media (min-width:640px) { #biz-grid { grid-template-columns:1fr 1fr; } }
    .biz-card { border-width:1px; transition:border-color .15s; }
    .biz-card:hover { border-color:var(--gold); }
  </style>
</head>
<body>
  <div class="soft-banner">Rubric v0.4 · <span id="stat-line">Loading…</span></div>
  <nav class="site-nav">
    <a href="index.html">Hub</a>
    <a href="directory.html" class="active">Directory</a>
    <a href="categories/index.html">Categories</a>
    <a href="methodology.html">Methodology</a>
    <a href="about.html">About</a>
    <a href="suggest.html">Suggest</a>
  </nav>
  <div class="wrap">
    <div class="module-tag">Directory</div>
    <h1 class="profile-title">Fredericksburg <span style="color:var(--gold)">Listings</span></h1>
    <p class="meta">Filter by category or band · Tap scorecard for factor detail</p>

    <div class="panel">
      <div class="filter-bar">
        <input type="search" id="q" placeholder="Search name…" aria-label="Search" />
        <select id="cat"><option value="">All categories</option></select>
        <select id="band">
          <option value="">All bands</option>
          <option value="green">🟢 Green</option>
          <option value="yellow">🟡 Yellow</option>
          <option value="red">🔴 Red</option>
          <option value="black">⬛ Black</option>
          <option value="gray">⚪ Gray</option>
        </select>
        <select id="sort">
          <option value="name">Sort: A–Z</option>
          <option value="band">Sort: Band</option>
          <option value="category">Sort: Category</option>
        </select>
      </div>
      <p class="count-line" id="count">—</p>
      <div id="biz-grid"></div>
    </div>
  </div>
  <script>
  (async function () {
    const bandColor = { green:'#4CAF50', yellow:'#FFC107', red:'#f44336', black:'#888', gray:'#888' };
    const bandOrder = { green:0, yellow:1, gray:2, red:3, black:4 };
    const res = await fetch('data/businesses.json', { cache:'no-store' });
    const data = await res.json();
    const all = (data.businesses || []).filter(b => b.publish !== false);
    document.getElementById('stat-line').textContent = `${all.length} listings · rubric ${data.rubric_version || '?'}`;

    const cats = [...new Set(all.map(b => b.category).filter(Boolean))].sort();
    const catEl = document.getElementById('cat');
    cats.forEach(c => {
      const o = document.createElement('option');
      o.value = c; o.textContent = c.replace(/-/g, ' ');
      catEl.appendChild(o);
    });

    function render() {
      const q = document.getElementById('q').value.trim().toLowerCase();
      const cat = document.getElementById('cat').value;
      const band = document.getElementById('band').value;
      const sort = document.getElementById('sort').value;
      let list = all.filter(b => {
        if (cat && b.category !== cat) return false;
        if (band && (b.overall || 'gray') !== band) return false;
        if (q && !(b.name || '').toLowerCase().includes(q)) return false;
        return true;
      });
      list.sort((a, b) => {
        if (sort === 'band') return (bandOrder[a.overall] ?? 9) - (bandOrder[b.overall] ?? 9) || a.name.localeCompare(b.name);
        if (sort === 'category') return (a.category || '').localeCompare(b.category || '') || a.name.localeCompare(b.name);
        return a.name.localeCompare(b.name);
      });
      document.getElementById('count').textContent = `Showing ${list.length} of ${all.length}`;
      document.getElementById('biz-grid').innerHTML = list.map(b => {
        const c = bandColor[b.overall] || bandColor.gray;
        return `<article class="biz-card" style="border-color:${c}55">
          <div class="eyebrow" style="color:${c}">${(b.overall||'gray').toUpperCase()}${b.featured?' · Featured':''}${b.adam_visited?' · Visited':''}</div>
          <h3>${b.name}</h3>
          <div class="meta">${(b.category||'').replace(/-/g,' ')} · ${b.city||''}</div>
          <p style="font-size:0.9rem;color:var(--gray-light);margin:0 0 10px">${(b.summary||'').slice(0,160)}${(b.summary||'').length>160?'…':''}</p>
          <a class="btn solid" href="business/${b.slug}.html">Scorecard →</a>
        </article>`;
      }).join('') || '<p style="color:var(--gray)">No matches.</p>';
    }
    ['q','cat','band','sort'].forEach(id => document.getElementById(id).addEventListener('input', render));
    render();
  })();
  </script>
</body>
</html>
